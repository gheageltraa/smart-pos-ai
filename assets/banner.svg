<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Kopipintar - Smart POS and AI Inventory Forecast</title>
  <desc id="d">Animated banner with a steaming coffee cup and rotating taglines</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f33">
        <animate attributeName="stop-color" values="#173f33;#1f6a52;#173f33" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2f8f6e">
        <animate attributeName="stop-color" values="#2f8f6e;#3aa77f;#2f8f6e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>

  <!-- floating dots -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="640" cy="60" r="26"><animate attributeName="cy" values="60;48;60" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="170" r="40"><animate attributeName="cy" values="170;184;170" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="50" r="14"><animate attributeName="cy" values="50;38;50" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- coffee cup -->
  <g transform="translate(130 140)">
    <ellipse cx="0" cy="62" rx="62" ry="9" fill="#000" opacity="0.18"/>
    <path d="M-38 -8 H38 V22 Q38 62 0 62 Q-38 62 -38 22 Z" fill="#ffffff"/>
    <path d="M38 6 h10 a14 14 0 0 1 0 30 h-12" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M-30 4 H30" stroke="#2f8f6e" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- steam -->
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
      <path d="M-18 -18 q-9 -12 0 -24 t0 -24" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 8;0 -12" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -18 q-9 -12 0 -24 t0 -24" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="3s" begin="0.9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 8;0 -12" dur="3s" begin="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M18 -18 q-9 -12 0 -24 t0 -24" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="3s" begin="1.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 8;0 -12" dur="3s" begin="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- title -->
  <text x="270" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#ffffff" opacity="0">
    Kopipintar
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <animate attributeName="x" from="250" to="270" dur="1.2s" fill="freeze"/>
  </text>
  <text x="272" y="146" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#d7f3e6" opacity="0">
    Smart POS &amp; AI Inventory Forecast
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- rotating taglines -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">
    <text x="272" y="190" opacity="0">Kasir yang cepat &amp; rapi
      <animate attributeName="opacity" keyTimes="0;0.05;0.30;0.35;1" values="0;1;1;0;0" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="272" y="190" opacity="0">Stok selalu terpantau
      <animate attributeName="opacity" keyTimes="0;0.33;0.38;0.63;0.68;1" values="0;0;1;1;0;0" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="272" y="190" opacity="0">Prediksi kapan harus belanja lagi
      <animate attributeName="opacity" keyTimes="0;0.66;0.71;0.96;1" values="0;0;1;1;0" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="876" y="224" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d7f3e6" opacity="0.85">Tim JiwooOrCarmen</text>
</svg>
